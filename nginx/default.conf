server {
        root /var/www/alekseev.mywire.org/html;
        index index.html index.htm;
        server_name alekseev.mywire.org www.alekseev.mywire.org;

        location / {
        }

        location /content/ {
                proxy_pass http://127.0.0.1:82/content.html;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Real-IP $remote_addr;
        }

        location /music/ {
                proxy_pass http://127.0.0.1:82/mix.mp3;
                add_header Content-Disposition 'attachment; filename="mix.mp3"';
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Real-IP $remote_addr;

        }

        location /apache/ {
                proxy_pass http://127.0.0.1:81/phpinfo.php;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Real-IP $remote_addr;
        }

        location /secondserver/ {
                proxy_pass https://www.onliner.by/;
                #proxy_set_header Host $host;
                #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                #proxy_set_header X-Real-IP $remote_addr;
        }

        location /redblue/ {
                proxy_pass http://127.0.0.1:85/;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Real-IP $remote_addr;
        }
        
    #listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/alekseev.mywire.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/alekseev.mywire.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
        if ($host = www.alekseev.mywire.org) {
        return 301 https://$host$request_uri;
         } # managed by Certbot


        if ($host = alekseev.mywire.org) {
        return 301 https://$host$request_uri;
         } # managed by Certbot

        listen 80;
        #listen [::]:80;

        server_name alekseev.mywire.org www.alekseev.mywire.org;
        return 404; # managed by Certbot
}